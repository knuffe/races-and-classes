<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meine Bilder</title>

  <style>
    body {
      margin: 0;
      background-color: #111;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;
    }

    .gallery {
      position: relative;

      width: 90%;
      height: 90vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    #bild {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);

      width: 60px;
      height: 60px;

      border: none;
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.6);
      color: white;

      font-size: 35px;
      cursor: pointer;
    }

    #links {
      left: 20px;
    }

    #rechts {
      right: 20px;
    }

    button:hover {
      background: black;
    }

    #zaehler {
      position: absolute;
      bottom: 20px;

      color: white;
      background: rgba(0,0,0,0.6);

      padding: 8px 15px;
      border-radius: 20px;
    }
  </style>

</head>

<body>

  <div class="gallery">

    <button id="links">‹</button>

    <img id="bild" src="bilder/bild1.jpg">

    <button id="rechts">›</button>

    <div id="zaehler">1 / 10</div>

  </div>


  <script>

const images = [
  "bilder/Handbuch.jpg",
  "bilder/Handbuch(1).jpg",
  "bilder/Handbuch(2).jpg",
  "bilder/Handbuch(3).jpg",
  "bilder/Handbuch(4).jpg",
  "bilder/Handbuch(5).jpg",
  "bilder/Handbuch(6).jpg",
  "bilder/Handbuch(7).jpg",
  "bilder/Handbuch(8).jpg",
  "bilder/Handbuch(9).jpg",
  "bilder/Handbuch(10).jpg",
  "bilder/Handbuch(11).jpg",
  "bilder/Handbuch(12).jpg",
  "bilder/Handbuch(13).jpg",
  "bilder/Handbuch(14).jpg",
  "bilder/Handbuch(15).jpg",
  "bilder/Handbuch(16).jpg",
  "bilder/Handbuch(17).jpg",
  "bilder/Handbuch(18).jpg",
  "bilder/Handbuch(19).jpg",
  "bilder/Handbuch(20).jpg",
  "bilder/Handbuch(21).jpg"
];

    let aktuell = 0;

    const bild = document.getElementById("bild");
    const zaehler = document.getElementById("zaehler");


    function anzeigen() {

      bild.src = bilder[aktuell];

      zaehler.textContent =
        (aktuell + 1) + " / " + bilder.length;
    }


    document.getElementById("rechts").onclick = function() {

      aktuell++;

      if (aktuell >= bilder.length) {
        aktuell = 0;
      }

      anzeigen();
    };


    document.getElementById("links").onclick = function() {

      aktuell--;

      if (aktuell < 0) {
        aktuell = bilder.length - 1;
      }

      anzeigen();
    };


    document.addEventListener("keydown", function(event) {

      if (event.key === "ArrowRight") {
        document.getElementById("rechts").click();
      }

      if (event.key === "ArrowLeft") {
        document.getElementById("links").click();
      }

    });

  </script>

</body>

</html>
